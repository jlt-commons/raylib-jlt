name: CI

# ---------------------------------------------------------------------------
# Runs on pull requests and pushes to main, plus manual dispatch.
#
# Actions is free for standard runners on public repositories, which this repo
# now is, so the PR gate costs nothing. It was authored dormant while the repo
# was private, where minutes bill against the account's included quota.
#
# The gate that matters most is "Compile every example": it is the only check
# that catches a new example missing its `check.clj` require, the easiest of
# the four touchpoints to skip (see CONTRIBUTING.md).
# ---------------------------------------------------------------------------

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      jolt-version:
        description: "jolt version to install (blank = the pinned JOLT_VERSION below)"
        required: false
        default: ""

permissions:
  contents: read

# jolt is pinned for the same reason the other tool versions below are pinned:
# a floating `latest` lets a release published overnight turn CI red on a tree
# nobody touched. That is not hypothetical here. jolt v0.8.0 published on
# 2026-09-01 and reverses jolt.ffi/write's last two arguments (jolt-lang/jolt#802),
# and both spellings are plain integers, so an older or newer runtime than the
# code expects writes to the wrong place and reports nothing.
#
# Moving this pin IS the cutover commit for a breaking jolt change. Bump it and
# adapt the call sites together, in one reviewed commit. To try a candidate
# first, use a workflow_dispatch run with the jolt-version input, which
# overrides this for that run only.
env:
  JOLT_VERSION: ${{ inputs.jolt-version || '0.8.6' }}

jobs:
  gates:
    name: compile · test · lint · format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      # raylib's availability in Ubuntu's archive varies by release, so this
      # tries the distro package first and falls back to a source build.
      # The fallback is not a workaround for a broken package name. The
      # README documents source builds as a supported path, and it pins what
      # gets linked instead of inheriting whatever the runner image ships.
      #
      # `bb lib:install` resolves to libraylib-dev on apt systems (see
      # installer-plan in bb.edn). The -dev package is the one that matters:
      # it ships the unversioned libraylib.so symlink that deps.edn's
      # :jolt/native looks for, which the runtime package alone does not.
      - name: Install libraylib
        run: |
          set -euo pipefail
          sudo apt-get update -qq

          echo "::group::what the archive offers"
          apt-cache search raylib || true
          apt-cache policy libraylib-dev || true
          echo "::endgroup::"

          if sudo apt-get install -y libraylib-dev; then
            echo "installed libraylib-dev from apt"
          else
            echo "libraylib-dev unavailable, building raylib from source"
            # raylib's own documented Linux build dependencies
            sudo apt-get install -y --no-install-recommends \
              build-essential cmake git \
              libasound2-dev libx11-dev libxrandr-dev libxi-dev \
              libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
              libxinerama-dev libxkbcommon-dev
            git clone --depth 1 --branch "$RAYLIB_REF" https://github.com/raysan5/raylib /tmp/raylib
            cmake -S /tmp/raylib -B /tmp/raylib/build \
              -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF
            cmake --build /tmp/raylib/build -j"$(nproc)"
            sudo cmake --install /tmp/raylib/build
            sudo ldconfig
          fi
        env:
          # Pinned rather than tracking master, so a CI failure means this
          # repo changed, not that upstream did.
          RAYLIB_REF: "6.0"

      # Official install script from jolt's README. Prebuilt Linux x86_64
      # binaries need glibc 2.35+, which ubuntu-latest satisfies.
      # Passed through env rather than interpolated into the script body, so
      # the input can't be used for shell injection.
      - name: Install jolt
        run: |
          set -euo pipefail
          : "${JOLT_VERSION:?empty; the workflow-level pin did not resolve}"
          curl -sSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --version "$JOLT_VERSION"
          jolt --version

      # Versions are pinned to match what the maintainer runs locally and what
      # the `bb hooks:install` pre-commit hook enforces. Floating these to
      # `latest` would let CI disagree with a clean local commit whenever
      # clj-kondo or clojure-lsp changes a default.
      #   `cli` (Clojure CLI) is required by clojure-lsp for classpath
      #   discovery and by `bb lint`'s fallback path when no native clj-kondo
      #   is present. Nothing in the example suite needs a JVM at runtime.
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: 1.12.196
          clj-kondo: "2026.05.25"
          cli: latest

      - uses: clojure-lsp/setup-clojure-lsp@v1.0.3
        with:
          clojure-lsp-version: "2026.05.05-12.58.26"

      # Fails loudly with the search paths it tried, so a packaging change on
      # the runner image is diagnosable from the log alone.
      #
      # This also gates the VERSION, which is what makes the apt-first install
      # above safe. The pin only governs the source-build fallback; when apt
      # succeeds we get whatever the archive carries. Since DrawCircleGradient
      # takes a by-value Vector2 in 6.0 and two ints before it, same symbol
      # name. An older library links fine and draws in the wrong place. So
      # lib:check refuses anything that does not export a 6.0-only symbol, and
      # this job goes red here rather than green at `bb check`.
      - name: libraylib is discoverable, and is 6.0+
        run: bb lib:check

      # The gate that matters most: compiles all 91 example namespaces
      # headlessly. It is the only check that catches a new example missing
      # its `check.clj` require, the easiest of the four touchpoints to skip.
      #
      # Failure output is echoed normally AND re-emitted as a ::error::
      # annotation plus a job summary. Annotations and summaries are readable
      # without downloading the log archive, which some networks block; a bare
      # `run: bb check` leaves a reader with nothing but "exit code 1".
      # Guards what the compile step below cannot see. `bb check` compiles
      # what check.clj requires, so an example missing from that list is never
      # compiled and the run still reports success. Needs no jolt and no
      # libraylib, so it is the cheapest gate here and runs first.
      # The only gate here that EXECUTES code rather than compiling it. Every
      # 4-argument ffi/write in this project is written in jolt 0.8.0's argument
      # order, and a runtime with the old order writes to the wrong address and
      # reports nothing, so a compile-only gate cannot see it. Measured: this
      # suite exits 0 on jolt 0.8.1 and exits 1 on v0.7.29.
      - name: Unit suite
        run: bb test

      - name: Registration touchpoints
        run: bb check:registration

      - name: Demo gallery and counts
        run: bb check:demos

      - name: Compile every example (headless)
        run: |
          set +e
          out="$(bb check 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            {
              printf '### `bb check` failed (exit %s)\n\n```\n%s\n```\n' \
                "$rc" "$(printf '%s\n' "$out" | tail -60)"
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$out" | tail -c 2000 \
              | python3 -c 'import sys; print("::error title=bb check failed::" + sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$rc"

      - name: clj-kondo
        run: bb lint:strict

      # Formatting is owned by clojure-lsp, not cljfmt. See the note at the
      # top of bb.edn for why only one formatter runs against src.
      - name: Formatting
        run: bb lsp:format-check

      - name: Namespace forms
        run: bb lsp:clean-ns-check

      # Runs only when something above failed. `bb lib:check` proves the .so
      # FILE exists; it never dlopens it, so a library that is present but
      # unloadable (a missing runtime GL/X11 dependency on a headless runner)
      # passes that check and fails at compile time. This reports the linkage
      # facts that distinguish the two, as an annotation so it is readable
      # without the log archive.
      - name: Diagnostics (on failure)
        if: failure()
        run: |
          set +e
          lib="$(ldconfig -p | grep -m1 libraylib | awk '{print $NF}')"
          {
            echo "resolved libraylib: ${lib:-<not in ldconfig cache>}"
            echo
            echo "ldd:"
            if [ -n "$lib" ]; then ldd "$lib" 2>&1; else echo "  (skipped, no library to inspect)"; fi
            echo
            echo "unresolved above (if any) are the missing runtime deps."
            echo
            echo "jolt:  $(jolt --version 2>&1 | head -1)"
            echo "bb:    $(bb --version 2>&1 | head -1)"
          } > /tmp/diag.txt
          cat /tmp/diag.txt
          {
            printf '### Diagnostics\n\n```\n'; cat /tmp/diag.txt; printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -c 2000 /tmp/diag.txt \
            | python3 -c 'import sys; print("::error title=libraylib diagnostics::" + sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
