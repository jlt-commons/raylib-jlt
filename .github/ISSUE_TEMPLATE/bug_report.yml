name: Bug report
description: A binding crashes, renders wrong, or won't compile
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Most failures here come down to three things: your CPU architecture, your
        jolt version, and where `libraylib` came from. Please fill those in. They
        turn a guess into a diagnosis.

        **A problem with one example program?** The examples moved to
        [raylib-jolt-demo](https://github.com/jlt-commons/raylib-jolt-demo), so
        please file it there unless the cause is in a binding here.

        **Known issue, please check first:** `with-camera-2d` and `with-camera-3d`
        pass a struct by value using an AArch64-specific pointer trick.
        On **x86-64** they can crash with an invalid memory reference. That is
        [documented and expected](https://github.com/jlt-commons/raylib-jlt/blob/main/docs/guide/struct-by-value-pointer-trick.md),
        not a new bug, though a portable rlgl-matrix replacement is very welcome.

  - type: input
    id: binding
    attributes:
      label: Which binding or namespace?
      description: The function or namespace, e.g. `rl/rect!` or `net.b12n.raylib.camera`, and the program that shows the problem.
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Paste the full error output if there is one.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please paste the output of these three commands.
      value: |
        ```
        $ uname -sm
        (paste here, OS and CPU architecture)

        $ jolt --version
        (paste here)

        $ bb lib:check
        (paste here, tells us whether libraylib was found and where)
        ```
    validations:
      required: true

  - type: dropdown
    id: raylib-source
    attributes:
      label: Where did libraylib come from?
      options:
        - System package manager (brew / pacman / apt / dnf / zypper / apk)
        - A source build, pointed at via LD_LIBRARY_PATH / DYLD_LIBRARY_PATH
        - Not sure
    validations:
      required: true

  - type: textarea
    id: compile-check
    attributes:
      label: Does the headless load-check pass?
      description: |
        `bb check:lib` loads every library namespace without opening a window.
        If it fails, the problem is in the binding layer itself. Paste its
        output here.
      value: |
        ```
        $ bb check:lib
        (paste here)
        ```
